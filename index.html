                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-agri-600 to-aqua-500">Berbasis Data & AI</span>

        const Sectors = () => {

            return (

                                        {React.cloneElement(sector.icon, { size: 28 })}
                                    </div>

        const Features = () => {
            const [activeTab, setActiveTab] = React.useState('farming');
            const [controls, setControls] = React.useState({
                irrigation: true,
                fertilizer: false,
                exhaust: true,
                misting: false,
                aerator: true,
                feeder: false
            });
            const [isCameraActive, setIsCameraActive] = React.useState(false);
            const videoRef = React.useRef(null);
            const [cameraError, setCameraError] = React.useState('');

            const toggleControl = (key) => {
                setControls(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const startCamera = async () => {
                setCameraError('');
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        setIsCameraActive(true);
                    }
                } catch (err) {
                    console.error("Error accessing camera:", err);
                    setCameraError('Gagal mengakses kamera. Pastikan Anda telah memberikan izin.');
                }
            };

            const stopCamera = () => {
                if (videoRef.current && videoRef.current.srcObject) {
                    const tracks = videoRef.current.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                    videoRef.current.srcObject = null;
                }
                setIsCameraActive(false);
            };

            // Clean up camera stream when component unmounts or tab changes
            React.useEffect(() => {
                return () => {
                    stopCamera();
                };
            }, [activeTab]);


            const renderToggle = (label, controlKey, activeColorClass, bgActive, ringColor) => (
                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center transition-colors duration-300">
                    <div>
                        <p className="text-xs text-slate-500">{label}</p>
                        <p className={`font-bold transition-colors duration-300 ${controls[controlKey] ? activeColorClass : 'text-slate-400'}`}>
                            {controls[controlKey] ? 'AKTIF' : 'STANDBY'}
                        </p>
                    </div>
                    <button 
                        onClick={() => toggleControl(controlKey)}
                        className={`w-12 h-6 rounded-full relative transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-offset-1 ${ringColor} ${controls[controlKey] ? bgActive : 'bg-slate-300'}`}
                        aria-pressed={controls[controlKey]}
                    >
                        <span className="sr-only">Toggle {label}</span>
                        <div className={`w-4 h-4 bg-white rounded-full absolute top-1 transition-transform duration-300 ease-in-out ${controls[controlKey] ? 'translate-x-7' : 'translate-x-1'}`}></div>
                    </button>
                </div>
            );

            return (
                <div id="fitur" className="py-20 bg-slate-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                            
                            <div>
                                <h2 className="text-agri-600 font-semibold tracking-wide uppercase text-sm mb-2">Teknologi Inti & Demo Interaktif</h2>
                                <p className="mt-2 text-3xl leading-8 font-extrabold tracking-tight text-slate-900 sm:text-4xl mb-6">
